<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erosbound Online — Alpha</title><style>*{box-sizing:border-box}body{margin:0;background:#100d18;color:#eee;font:14px system-ui;overflow:hidden}canvas{display:block;image-rendering:pixelated}#hud,#help,#msg{position:fixed;background:#171321e8;border:1px solid #57486f;border-radius:10px;padding:10px 12px}#hud{left:14px;top:14px;min-width:240px}#help{right:14px;top:14px}#msg{left:50%;bottom:20px;transform:translateX(-50%);max-width:680px;text-align:center}.bar{height:10px;background:#32283e;border-radius:8px;overflow:hidden;margin:4px 0 8px}.fill{height:100%}.hp{background:#d85b69}.xp{background:#9b7ae8}#panel{position:fixed;inset:0;background:#08070dbb;display:none;align-items:center;justify-content:center}.card{width:min(560px,92vw);background:#1c1728;border:1px solid #8069a4;border-radius:14px;padding:22px}button{background:#6f55a7;color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:5px;cursor:pointer}button:hover{background:#876ac2}.muted{color:#aaa}</style></head><body><canvas id="game"></canvas><div id="hud"><b>Erosbound Online</b><div id="stats"></div><div class="bar"><div id="hp" class="fill hp"></div></div><div class="bar"><div id="xp" class="fill xp"></div></div><div id="quest"></div></div><div id="help"><b>Управление</b><br>WASD / стрелки — движение<br>Space — атака<br>E — взаимодействие<br>R — возрождение</div><div id="msg">Найди Элиру у таверны или отправляйся в лес.</div><div id="panel"><div class="card" id="card"></div></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d');function resize(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',resize);resize();const W=1600,H=1000,keys={},save=JSON.parse(localStorage.getItem('erosboundSave')||'null'),p=Object.assign({x:410,y:480,hp:100,maxHp:100,xp:0,level:1,gold:10,key:false,kills:0,route:null},save||{}),npc={x:600,y:390},mobs=[];for(let i=0;i<14;i++)mobs.push({x:850+Math.random()*600,y:150+Math.random()*700,hp:30,maxHp:30,dead:0});const ghosts=[{x:470,y:560,n:'Luna'},{x:720,y:500,n:'Kael'},{x:350,y:650,n:'Mira'}];let cam={x:0,y:0},attack=0,invuln=0;const el=s=>document.querySelector(s);function persist(){localStorage.setItem('erosboundSave',JSON.stringify(p))}function say(s){el('#msg').textContent=s}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')hit();if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='r'&&p.hp<=0){p.hp=p.maxHp;p.x=410;p.y=480}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function levelup(){let n=p.level*100;if(p.xp>=n){p.xp-=n;p.level++;p.maxHp+=15;p.hp=p.maxHp;say('Новый уровень: '+p.level)}}function hit(){if(p.hp<=0||attack)return;attack=18;let got=false;mobs.forEach(m=>{if(!m.dead&&d(p,m)<75){got=true;m.hp-=15+p.level*3;if(m.hp<=0){m.dead=300;p.xp+=20;p.gold+=3;p.kills++;say('Монстр побеждён: +20 XP, +3 золота');levelup();persist()}}});if(!got)say('Атака не достигла цели.')}function interact(){if(d(p,npc)<95)showNpc();else say('Рядом нет персонажа для взаимодействия.')}function showNpc(){el('#card').innerHTML='<h2>Элира, хозяйка таверны</h2><p>«Старые руины снова беспокоят город. Тебе нужна карта и ключ?»</p>'+(p.key?'<p class="muted">Ключ уже получен.</p>':'')+'<button onclick="route(\'talk\')">Договориться</button><button onclick="route(\'romance\')">Флиртовать</button><button onclick="route(\'duel\')">Дружеский поединок</button><button onclick="closeP()">Уйти</button>';el('#panel').style.display='flex'}function route(r){p.route=r;p.key=true;p.xp+=35;p.gold+=5;levelup();persist();let t=r==='talk'?'Вы договорились, и Элира доверяет тебе карту руин.':r==='romance'?'Флирт оказался взаимным. После тёплого вечера сцена затемняется; Элира дарит тебе ключ.':'После честного тренировочного поединка Элира вручает тебе ключ.';el('#card').innerHTML='<h2>Успех</h2><p>'+t+'</p><p><b>Награда:</b> ключ, +35 XP, +5 золота.</p><button onclick="closeP()">Продолжить</button>'}function closeP(){el('#panel').style.display='none'}function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a-cam.x),Math.round(b-cam.y),w,h)}function label(s,a,b,col='#fff'){x.fillStyle=col;x.font='13px monospace';x.textAlign='center';x.fillText(s,Math.round(a-cam.x),Math.round(b-cam.y))}
function loop(){requestAnimationFrame(loop);if(attack)attack--;if(invuln)invuln--;if(p.hp>0&&el('#panel').style.display!=='flex'){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),z=Math.hypot(dx,dy)||1;p.x=Math.max(25,Math.min(W-25,p.x+dx/z*3.3));p.y=Math.max(25,Math.min(H-25,p.y+dy/z*3.3))}cam.x=Math.max(0,Math.min(Math.max(0,W-c.width),p.x-c.width/2));cam.y=Math.max(0,Math.min(Math.max(0,H-c.height),p.y-c.height/2));x.fillStyle='#1d351e';x.fillRect(0,0,c.width,c.height);for(let i=0;i<W;i+=64)for(let j=0;j<H;j+=64)if((i+j)/64%2===0)rect(i,j,64,64,'#213b22');rect(180,220,430,280,'#51402f');rect(220,260,350,210,'#8b6945');rect(350,420,80,50,'#3d2b22');label('ТАВЕРНА',395,305,'#ffe3a1');rect(760,0,12,H,'#476b38');label('Дикий лес',1120,80,'#bfe6a9');for(let i=0;i<20;i++){let tx=820+(i*137)%700,ty=90+(i*211)%820;rect(tx,ty,22,35,'#315d35');rect(tx-12,ty-12,46,30,'#477d43')}ghosts.forEach((g,i)=>{g.x+=Math.sin(Date.now()/900+i)*.18;g.y+=Math.cos(Date.now()/1100+i)*.18;rect(g.x-10,g.y-14,20,28,'#5f8bd4');label(g.n,g.x,g.y-22,'#cfe2ff')});rect(npc.x-11,npc.y-15,22,30,'#d979a5');label('Элира [E]',npc.x,npc.y-23,'#ffd1e6');mobs.forEach(m=>{if(m.dead){m.dead--;if(!m.dead){m.hp=m.maxHp;m.x=850+Math.random()*600;m.y=150+Math.random()*700}return}let q=d(p,m);if(q<220&&p.hp>0){let dx=p.x-m.x,dy=p.y-m.y,z=Math.hypot(dx,dy)||1;m.x+=dx/z*.55;m.y+=dy/z*.55;if(q<34&&!invuln){p.hp-=8;invuln=45;if(p.hp<=0){p.hp=0;say('Ты потерял сознание. Нажми R для возрождения.')}}}rect(m.x-13,m.y-11,26,22,'#b34b5b');label('Слизень '+m.hp+'/'+m.maxHp,m.x,m.y-18,'#ffc2c8')});rect(p.x-12,p.y-16,24,32,attack?'#ffe58a':'#9a7cf0');label('Ты',p.x,p.y-24);if(attack){x.strokeStyle='#ffe58a';x.beginPath();x.arc(p.x-cam.x,p.y-cam.y,48,0,Math.PI*2);x.stroke()}el('#hp').style.width=p.hp/p.maxHp*100+'%';let need=p.level*100;el('#xp').style.width=p.xp/need*100+'%';el('#stats').innerHTML='Ур. '+p.level+' · HP '+p.hp+'/'+p.maxHp+' · '+p.gold+' золота';el('#quest').innerHTML=p.key?'✓ Ключ от руин · Побед: '+p.kills:'Задание: поговори с Элирой'}loop();
</script></body></html>
