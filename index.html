<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erosbound Online — GitHub Pages MVP</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="top"><b>EROSBOUND ONLINE</b><span>GitHub Pages Alpha • 18+ fantasy prototype</span><input id="name" value="Adventurer" maxlength="18"><button id="rename">Set name</button></div>
<div id="game"><canvas id="c" width="1200" height="700"></canvas><div id="hud"><div>HP <span id="hp">100</span>/100</div><div>Gold <span id="gold">25</span></div><div>XP <span id="xp">0</span></div></div><div id="prompt"></div></div>
<div id="panel"><div id="dialog"><b>Quest:</b> Speak with Elira in the tavern. Every route gives the dungeon key.</div><div id="actions"><button data-a="talk">💬 Negotiate</button><button data-a="romance">♥ Romance</button><button data-a="fight">⚔ Duel</button></div><div id="chatlog"></div><div id="chatrow"><input id="chat" placeholder="Local demo chat…"><button id="send">Send</button></div></div>
<script src="./game.js"></script></body></html>
